services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce_research
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "${V2_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_research"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${V2_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: cart-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce_research
      DB_USER: commerce
      DB_PASSWORD: commerce
    ports:
      - "${V2_CART_PORT:-18081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce_research
      DB_USER: commerce
      DB_PASSWORD: commerce
    ports:
      - "${V2_ORDER_PORT:-18082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  payment-simulator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-simulator
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce_research
      DB_USER: commerce
      DB_PASSWORD: commerce
    ports:
      - "${V2_PAYMENT_PORT:-18083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: orchestrator
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce_research
      DB_USER: commerce
      DB_PASSWORD: commerce
      ORDER_SERVICE_BASE_URL: http://order-service:8082
      PAYMENT_SERVICE_BASE_URL: http://payment-simulator:8083
      COMMERCE_CART_SERVICE_BASE_URL: http://cart-service:8081
    ports:
      - "${V2_ORCHESTRATOR_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
