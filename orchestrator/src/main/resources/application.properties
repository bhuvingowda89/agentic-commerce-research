server.port=8080
spring.application.name=orchestrator
commerce.cart-service.base-url=${CART_SERVICE_BASE_URL:${COMMERCE_CART_SERVICE_BASE_URL:http://localhost:8081}}
commerce.order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8082}
commerce.payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/commerce_research}
spring.datasource.username=${DB_USER:commerce}
spring.datasource.password=${DB_PASSWORD:commerce}
spring.datasource.hikari.maximum-pool-size=10
retry.maxAttempts=3
